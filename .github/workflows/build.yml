name: Build Packages

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android (APK, arm64-v8a)"
        type: boolean
        default: true
      build_desktop:
        description: "Build Desktop (Windows / Linux / macOS)"
        type: boolean
        default: true
      build_ios:
        description: "Build iOS simulator .app（真机 IPA 需 Apple 证书 Secrets）"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ----------------------------------------------------------------
  # Android：release APK（arm64-v8a），必须用仓库 Secrets 签名
  # Secrets: KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
  # ----------------------------------------------------------------
  android:
    if: github.event_name == 'push' || inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 不要装已废弃的 tools 包，否则 sdkmanager 会直接失败
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64。请用本地 key.jks 上传到仓库 Secrets。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/key.jks"
          echo "Keystore restored to key.jks"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android release APK (arm64-v8a)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少 KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD Secrets"
            exit 1
          fi
          ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Desktop：deb / msi+exe / dmg
  # ----------------------------------------------------------------
  desktop:
    if: github.event_name == 'push' || inputs.build_desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            tasks: ":desktopApp:packageDeb"
          - os: windows-latest
            arch: x64
            tasks: ":desktopApp:packageMsi :desktopApp:packageExe"
          - os: macos-latest
            arch: arm64
            tasks: ":desktopApp:packageDmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop package
        run: ./gradlew ${{ matrix.tasks }} --stacktrace

      - name: Add arch suffix to package filenames
        shell: bash
        run: |
          cd desktopApp/build/compose/binaries/main
          for ext in deb msi exe dmg; do
            find . -type f -name "*.$ext" | while read -r f; do
              mv "$f" "${f%.$ext}-${{ matrix.arch }}.$ext"
            done
          done

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktopApp/build/compose/binaries/main/**/*.deb
            desktopApp/build/compose/binaries/main/**/*.msi
            desktopApp/build/compose/binaries/main/**/*.exe
            desktopApp/build/compose/binaries/main/**/*.dmg
          if-no-files-found: error

  desktop-arm:
    if: github.event_name == 'push' || inputs.build_desktop
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch: arm64
            tasks: ":desktopApp:packageDeb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop package
        run: ./gradlew ${{ matrix.tasks }} --stacktrace

      - name: Add arch suffix to package filenames
        shell: bash
        run: |
          cd desktopApp/build/compose/binaries/main
          for ext in deb msi exe dmg; do
            find . -type f -name "*.$ext" | while read -r f; do
              mv "$f" "${f%.$ext}-${{ matrix.arch }}.$ext"
            done
          done

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktopApp/build/compose/binaries/main/**/*.deb
            desktopApp/build/compose/binaries/main/**/*.msi
            desktopApp/build/compose/binaries/main/**/*.exe
            desktopApp/build/compose/binaries/main/**/*.dmg
          if-no-files-found: error

  # ----------------------------------------------------------------
  # iOS：默认模拟器；配置 Apple Secrets 后可导出 IPA
  # ----------------------------------------------------------------
  ios:
    if: github.event_name == 'push' || inputs.build_ios
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Link shared framework (Gradle)
        run: ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64 --stacktrace

      - name: Import signing (optional)
        env:
          IOS_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_P12" ]; then
            echo "No iOS signing certificate; building simulator only."
            exit 0
          fi
          echo "$IOS_P12" | base64 -D -o cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security unlock-keychain -p "" build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISION" | base64 -D -o "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"

      - name: Build & export iOS
        env:
          IOS_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          cd iosApp
          if [ -n "$IOS_P12" ]; then
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0">'
              echo '<dict>'
              echo '  <key>signingStyle</key>'
              echo '  <string>manual</string>'
              echo '  <key>method</key>'
              echo '  <string>ad-hoc</string>'
              echo '  <key>teamID</key>'
              echo "  <string>$IOS_TEAM_ID</string>"
              echo '  <key>provisioningProfiles</key>'
              echo '  <dict>'
              echo '    <key>zhiqiu.app.PwdStore</key>'
              echo "    <string>$IOS_PROFILE_NAME</string>"
              echo '  </dict>'
              echo '</dict>'
              echo '</plist>'
            } > ExportOptions.plist
            xcodebuild -project iosApp.xcodeproj -scheme iosApp \
              -configuration Release archive \
              -archivePath build/iosApp.xcarchive \
              -allowProvisioningUpdates \
              CODE_SIGN_STYLE=manual DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY"
            xcodebuild -exportArchive -archivePath build/iosApp.xcarchive \
              -exportPath build/ipa -exportOptionsPlist ExportOptions.plist
          else
            xcodebuild -project iosApp.xcodeproj -scheme iosApp \
              -configuration Release -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO
            APP=$(find build -name "*.app" -type d | head -n1)
            ditto -c -k --sequesterRsrc --keepParent "$APP" ../ios-simulator.zip
          fi

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            iosApp/build/ipa/*.ipa
            ios-simulator.zip
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  # Release：tag 推送时汇总产物
  # ----------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, desktop, desktop-arm, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing release (clean stale assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes || true

      - name: Generate release notes manifest
        run: |
          {
            echo "# PwdStore ${GITHUB_REF_NAME}"
            echo
            echo "各平台安装包："
            echo
            find artifacts -type f -printf '%f\n' | sort | while read -r f; do
              case "$f" in
                *.apk) desc="Android 安装包（arm64-v8a）" ;;
                *-arm64.dmg|*-x64.dmg|*.dmg) desc="macOS 安装包" ;;
                *-arm64.msi|*-x64.msi|*.msi) desc="Windows MSI" ;;
                *-arm64.exe|*-x64.exe|*.exe) desc="Windows EXE" ;;
                *.deb) desc="Linux deb" ;;
                ios-simulator.zip) desc="iOS 模拟器包" ;;
                *.ipa) desc="iOS 真机 IPA" ;;
                *) desc="其他产物" ;;
              esac
              printf -- '- `%s` — %s\n' "$f" "$desc"
            done
          } > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: release_notes.md
